name: Agent Update Branch

# Reusable. The caller keeps the `pull_request_target: [labeled]` trigger rather
# than pull_request: the standard pull_request trigger depends on a generated
# merge commit, which GitHub fails to produce when the PR is out of date or
# conflicting — exactly the case this workflow exists for. pull_request_target
# runs in the base context and does not need the merge commit, so the labeled
# event fires. The first step refuses anything except same-repo agent branches
# before checkout or secret use. Do not relax that guard.

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm, pnpm, or yarn. Decides the install and exec commands."
        type: string
        default: npm
      sandcastle-path:
        description: >-
          Deprecated and ignored. The agent scripts moved into this kit
          (ADR-0002), so the path stopped being an axis of variation. The input
          survives only so existing caller files keep validating; delete the
          line from your caller.
        type: string
        default: .sandcastle
      kit-ref:
        description: >-
          Ref of bigapejit/bakuljan the agent harness is run from. `main` is the
          contract; pin a tag or SHA to hold a repo on a known-good harness.
        type: string
        default: main
      node-version:
        description: "Node version the agent scripts run on."
        type: string
        default: "22"
      git-user-name:
        description: "Commit author name for agent commits."
        type: string
        default: "claude-code[bot]"
      git-user-email:
        description: >-
          Commit author email for agent commits. Vercel matches preview builds on
          the author's email, so this should be an address on the repo owner's
          GitHub account for agent branches to get web previews.
        type: string
        required: true

jobs:
  update-branch:
    if: github.event.label.name == 'agent:update-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Installs the app's own dependencies — the ones the agent needs to
      # typecheck and lint. The harness has its own, from this kit's lockfile.
      PM_INSTALL: ${{ inputs.package-manager == 'pnpm' && 'pnpm install' || inputs.package-manager == 'yarn' && 'yarn install' || 'npm install' }}

    steps:
      - name: Refuse untrusted PR branch
        id: trust
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "reason=PR head repo $HEAD_REPO is not $GH_REPO." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$BRANCH" in
            agent/*)
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "reason=PR branch $BRANCH does not start with agent/." >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Comment on refused PR
        if: steps.trust.outputs.trusted != 'true'
        env:
          REASON: ${{ steps.trust.outputs.reason }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:update-branch\`: $REASON Automated branch updates only run on same-repo \`agent/*\` branches created by the agent implement workflow."

      - name: Pre-flight - refuse if PR is closed or merged
        if: steps.trust.outputs.trusted == 'true'
        id: state
        run: |
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:update-branch\`: PR is not open."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition labels - remove trigger and blocked, add in-progress
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Match the other agent mutator workflows: AGENT_PAT can push
          # workflow-file changes, while GITHUB_TOKEN remains the fallback.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Ensure branch is checked out by name
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        run: git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"

      - name: Check out the agent harness from the kit
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: bigapejit/bakuljan
          ref: ${{ inputs.kit-ref }}
          path: .agent-workflow
          # Cone mode, so this brings the harness plus every top-level file —
          # which is how package.json and package-lock.json arrive.
          sparse-checkout: sandcastle
          persist-credentials: false

      - name: Hide the harness checkout from the repo
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        # This job resolves conflicts and commits the merge from this working
        # tree, so the kit must be invisible to `git add`.
        run: echo "/.agent-workflow/" >> .git/info/exclude

      - name: Setup Node.js
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          # Keyed on the kit's lockfile rather than the caller's: it changes far
          # less often, so the ~/.npm cache it restores is nearly always warm.
          cache: npm
          cache-dependency-path: .agent-workflow/package-lock.json

      - name: Setup pnpm
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        run: $PM_INSTALL

      - name: Install the harness dependencies
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        working-directory: .agent-workflow
        run: npm ci --omit=dev --prefer-offline --no-audit --fund=false

      - name: Install Claude Code
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        env:
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Run update-branch.ts
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: .agent-workflow/node_modules/.bin/tsx .agent-workflow/sandcastle/update-branch/update-branch.ts

      - name: Push branch (abort cleanly if non-fast-forward)
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && success()
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          # Lease against the SHA we checked out. This fails if anything pushed
          # to the branch during our run, and tolerates history-rewriting
          # updates when the remote is unchanged.
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post PR comment
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi

      - name: Mark blocked on failure
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written - check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          \`agent:update-branch\` run failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:update-branch\` to retry.
          EOF
          )"

      - name: Always remove in-progress label
        if: always() && steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
