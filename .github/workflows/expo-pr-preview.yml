name: Expo PR Preview

# Reusable. The caller keeps the trigger, which must include ready_for_review:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review, labeled]
#
# ready_for_review is what makes the draft guard below usable: it is the moment
# an agent PR becomes something the owner is meant to scan.

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm, pnpm, or yarn. Decides the install command and the setup-node cache."
        type: string
        default: npm
      node-version:
        description: "Node version the bundle is built with. Part of the cache keys, so it must match the warm-caches caller."
        type: string
        default: "22"
      app-variant:
        description: "Value of APP_VARIANT for the bundle, for repos whose app config switches on it."
        type: string
        default: review
      preview-paths:
        description: >-
          dorny/paths-filter globs, one `- "glob"` list item per line, no leading
          indentation (they are spliced under `preview:` at the same column). A
          PR that touches none of them publishes nothing, unless it carries
          preview:force.
        type: string
        required: true
      convex-paths:
        description: >-
          Same shape as preview-paths: the globs that count as backend changes.
          Only consulted in per-convex-pr mode.
        type: string
        default: '- "convex/**"'
      convex-preview-mode:
        description: >-
          per-convex-pr: only a PR touching convex-paths gets a backend, minted
          throwaway with --preview-create and named after the PR number.
          shared-branch-backend: every previewed PR deploys to a --preview-name
          backend named for its branch, which is also where a web preview built
          by Convex's default CI naming lands.
        type: string
        required: true
      convex-seed-function:
        description: "Convex function --preview-run calls to seed a fresh preview backend."
        type: string
        default: "seed:run"
      eas-environment:
        description: "EAS environment whose variables the publish reads. Must match the warm-caches caller."
        type: string
        default: preview
      eas-platform:
        description: "Platform passed to eas update."
        type: string
        default: ios
      eas-update-branch:
        description: >-
          How the published update is named. `auto` passes --auto, which reads
          the name out of git — and a pull_request checkout is a detached HEAD,
          so every PR in the repo lands on one EAS branch literally named "HEAD"
          (visible in any --auto run's JSON output). That is survivable where the
          QR code this workflow comments is the only way anyone opens a preview,
          because a QR points at one update group regardless of its branch.
          `pr-branch` names the update after the PR's head ref instead, with the
          slashes replaced, which is what a repo needs when the name is also a
          handle: in shared-branch-backend mode it is the name the branch's
          Convex deployment carries, so one name finds a PR's bundle and its
          backend in both dashboards. `pr-branch` is the default because this
          workflow only ever runs on pull_request events, where `auto` can
          produce nothing but "HEAD"; `auto` remains only as an escape hatch
          back to the historical behavior.
        type: string
        default: pr-branch

jobs:
  # One job on purpose. The path filter used to be a job of its own, which meant
  # every preview paid two rounded runner minutes for five seconds of filtering;
  # it is a step now, with the same filters and the same convex/** answer.
  update:
    name: Publish review update
    # Drafts publish nothing. The implement agent and then the review agent both
    # push to a draft, so a draft preview was code the owner never scanned and
    # was usually cancelled mid-bundle by the next push; the first QR should be
    # the reviewed code. The review workflow marks the PR ready with AGENT_PAT
    # (see its "Mark PR ready for review" step) precisely so the resulting
    # ready_for_review event can wake this workflow — an event raised by the
    # default GITHUB_TOKEN is suppressed by GitHub and would leave ready PRs
    # with no preview at all. Do not change that step.
    #
    # preview:force overrides the draft guard, for an early look at a draft.
    # Label events only publish when the added label is preview:force — other
    # labels (agent:* workflow state) would otherwise re-bundle identical code.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'preview:force') &&
      (
        github.event.pull_request.draft == false ||
        contains(github.event.pull_request.labels.*.name, 'preview:force')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: expo-pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write

    env:
      APP_VARIANT: ${{ inputs.app-variant }}
      REVIEW_REF: "PR #${{ github.event.pull_request.number }}"
      REVIEW_GIT_REF: ${{ github.head_ref }}
      REVIEW_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL || vars.EXPO_PUBLIC_CONVEX_URL }}
      # A Convex *preview* deploy key: it can only create preview deployments,
      # never touch dev or prod, which is why it is safe to hand to a workflow
      # that runs on every PR. Read as an env var rather than inline, so the
      # steps below can branch on whether it exists (the secrets context is not
      # available in a step's `if`).
      CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      # The caller's package manager, resolved once into the commands the steps
      # below need.
      PM_CI: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --prefer-offline' || inputs.package-manager == 'yarn' && 'yarn install --immutable' || 'npm ci --prefer-offline --no-audit --fund=false' }}
      PM_EXEC: ${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || inputs.package-manager == 'yarn' && 'yarn' || 'npx' }}

    steps:
      # No checkout above this: on pull_request events paths-filter asks the API
      # for the changed files, which is why this can be the first thing the job
      # does and why a docs-only PR never installs anything.
      # `convex` is a narrower question than "should we publish": does this PR
      # change the backend? In per-convex-pr mode only those PRs need a backend
      # of their own, because only they carry functions and a schema the shared
      # dev deployment has never seen.
      #
      # Both inputs are spliced in at the same column as the key above them, so
      # a caller's list items need no indentation of their own — a multi-line
      # expression result is inserted verbatim, and only its first line would
      # inherit any indentation written here.
      - name: Detect preview scope
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            preview:
            ${{ inputs.preview-paths }}
            convex:
            ${{ inputs.convex-paths }}

      # The single answer every step below reads, so the file-scope rule lives in
      # one place instead of being repeated down the job.
      - name: Decide whether to publish
        id: scope
        env:
          PREVIEW_PATHS: ${{ steps.filter.outputs.preview }}
          FORCED: ${{ contains(github.event.pull_request.labels.*.name, 'preview:force') }}
        run: |
          if [ "$PREVIEW_PATHS" = "true" ] || [ "$FORCED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app-visible files changed, so no Expo preview was published. Add the preview:force label to publish one anyway."
          fi

      # The second single answer: does this PR bundle against a backend of its
      # own? The two modes differ only here, and every Convex step below reads
      # this instead of asking about the mode again.
      - name: Decide whether this PR needs its own Convex backend
        id: backend
        if: steps.scope.outputs.publish == 'true'
        env:
          MODE: ${{ inputs.convex-preview-mode }}
          CONVEX_CHANGED: ${{ steps.filter.outputs.convex }}
        run: |
          set -euo pipefail
          case "$MODE" in
            per-convex-pr)
              # Only a PR that rewrites the backend needs one of its own.
              if [ "$CONVEX_CHANGED" = "true" ]; then own="true"; else own="false"; fi
              ;;
            shared-branch-backend)
              # Every previewed PR joins the branch-named backend the repo's web
              # preview also deploys to, so every previewed PR deploys to it.
              own="true"
              ;;
            *)
              echo "convex-preview-mode must be per-convex-pr or shared-branch-backend, got: '$MODE'" >&2
              exit 1
              ;;
          esac
          echo "own=$own" >> "$GITHUB_OUTPUT"

      # CONVEX_PREVIEW_DEPLOY_KEY is deliberately not in this list. Without it a
      # PR still gets a preview, just one pointed at the shared dev deployment,
      # so a missing key is a warning further down rather than a red check.
      - name: Check required preview environment
        if: steps.scope.outputs.publish == 'true'
        run: |
          missing=()
          for name in EXPO_TOKEN EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY EXPO_PUBLIC_CONVEX_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets or variables: ${missing[*]}"
            echo "Create EXPO_TOKEN at https://expo.dev/settings/access-tokens. Copy the EXPO_PUBLIC_* values from the app environment."
            exit 1
          fi

      # The union of the optional EXPO_PUBLIC_* values the app repos on this kit
      # bundle: analytics keys, and an explicit .convex.site twin for an app that
      # does not derive one. A repo that sets none of them is unaffected, which
      # is the point of writing each name only when it has a value: an
      # EXPO_PUBLIC_* variable set to the empty string is not the same as an
      # unset one, because Metro inlines whatever is there and a `??` fallback in
      # the app would take "" as an answer. Add a name here and to the loop to
      # extend the list; there is no way to read a secret whose name is only
      # known at run time, so both halves have to be literal.
      #
      # EXPO_PUBLIC_CONVEX_SITE_URL is written before the Convex preview step
      # below on purpose: when a PR gets a backend of its own, that step's twin
      # is the right one and overwrites this.
      - name: Pass through optional public environment
        if: steps.scope.outputs.publish == 'true'
        env:
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_SITE_URL || vars.EXPO_PUBLIC_CONVEX_SITE_URL }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY || vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST || vars.EXPO_PUBLIC_POSTHOG_HOST }}
        run: |
          set -euo pipefail
          for name in EXPO_PUBLIC_CONVEX_SITE_URL EXPO_PUBLIC_POSTHOG_API_KEY EXPO_PUBLIC_POSTHOG_HOST; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Checkout repository
        if: steps.scope.outputs.publish == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.scope.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Setup pnpm
        if: steps.scope.outputs.publish == 'true' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      # npm workspaces can contain dependency trees outside the root
      # node_modules. Resolve exactly the same path input as warm-caches.yml so
      # a cache hit is a complete install and all three workflows agree on the
      # cache version as well as its key. Flat repos still use only node_modules.
      - name: Resolve node_modules cache paths
        id: node-modules-paths
        if: steps.scope.outputs.publish == 'true'
        shell: bash
        run: |
          paths=node_modules
          if node -e 'const w = require("./package.json").workspaces; const p = Array.isArray(w) ? w : w?.packages; process.exit(Array.isArray(p) && p.length > 0 ? 0 : 1)'; then
            paths+=$'\n**/*/node_modules\n!**/node_modules/**/node_modules'
          fi
          {
            echo 'paths<<EOF'
            echo "$paths"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Restore, never save. A cache written from a PR branch is readable from
      # that branch alone, and every agent PR is a branch that exists for a day,
      # so the only useful writer is warm-caches.yml on the default branch —
      # saving here would burn a minute uploading a cache nobody can read.
      #
      # No restore-keys either: an approximate node_modules is not a warm start,
      # it is the wrong dependency tree. A PR that touches the lockfile (or
      # patches/, which postinstall applies and a restored tree never re-runs)
      # misses on purpose and installs from the package manager's download cache
      # as before. All three lockfile names are hashed so the key does not have
      # to know which package manager the caller uses; only one of them exists.
      - name: Restore node_modules
        id: node-modules
        if: steps.scope.outputs.publish == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.node-modules-paths.outputs.paths }}
          key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'patches/**') }}

      - name: Install dependencies
        if: steps.scope.outputs.publish == 'true' && steps.node-modules.outputs.cache-hit != 'true'
        run: $PM_CI

      # eas-cli is expected as a pinned devDependency, so it arrives inside the
      # restored node_modules and costs nothing. It used to come from
      # expo/expo-github-action@v8, whose own eas-cli cache is answered with
      # HTTP 400 by the current GitHub cache service on every run — the action
      # then quietly reinstalled the CLI from scratch, ~26s of every preview.
      # Authentication is unchanged: eas-cli reads EXPO_TOKEN from the job env.
      # expo/expo-github-action/preview below resolves `eas` off PATH, which is
      # why the local bin directory has to be on it.
      - name: Use the project eas-cli
        if: steps.scope.outputs.publish == 'true'
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # Metro writes its transform cache to `os.tmpdir()/metro-cache` (SDK 55
      # builds the FileStore there; it is NOT node_modules/.cache/metro), so
      # TMPDIR is the only handle CI has on that path, and pinning it is what
      # makes the restore below point at the directory the bundle will read.
      # It has to be written here rather than in the job's `env:`, where the
      # runner context does not exist yet.
      - name: Point Metro's cache at the runner temp directory
        if: steps.scope.outputs.publish == 'true'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Metro's cache is content-addressed per module, so an older cache is
      # never wrong, only less complete: the newest one under the prefix is a
      # fine starting point and the PR's changed files re-transform.
      #
      # Except for one thing it is NOT keyed on: EXPO_PUBLIC_* values are
      # inlined into the modules that read them at transform time, and the cache
      # key ignores them (measured: two exports differing only in
      # EXPO_PUBLIC_CONVEX_URL produced byte-identical bundles carrying the first
      # run's URL). A PR with its own backend is exactly the case where that
      # value differs from the default branch's, so those PRs bundle cold rather
      # than risk a QR that points at the shared dev backend — the same swap the
      # publish steps below take pains to avoid. The warm job bundles under
      # `eas env:exec`, so for every other PR the inlined values match what
      # --environment supplies here. Change an EXPO_PUBLIC_* value in EAS and the
      # cache holds the old one until the default branch is re-warmed: run
      # warm-caches.yml by hand.
      - name: Restore the Metro transform cache
        if: steps.scope.outputs.publish == 'true' && steps.backend.outputs.own != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/metro-cache
          # Prefix only, deliberately: `key` and `restore-keys` are the same
          # string so no cache can ever win by exact match, and the newest one
          # the default branch warmed is always what a preview gets. Pinning
          # `key` to the PR's base commit would look sharper and be worse —
          # after an EXPO_PUBLIC_* change is re-warmed by hand, the base commit's
          # cache is precisely the stale one, and an exact hit would keep
          # choosing it over the fresh one. Content-addressing is what makes the
          # loose key safe: an older cache is never wrong, only less complete.
          key: metro-cache-${{ runner.os }}-node${{ inputs.node-version }}-
          restore-keys: |
            metro-cache-${{ runner.os }}-node${{ inputs.node-version }}-

      # A PR that rewrites the backend cannot be reviewed against the shared dev
      # deployment: its functions and schema were never pushed there, and pushing
      # them would break every other preview and the owner's own phone. So it
      # gets a backend of its own, seeded because a fresh preview deployment is
      # born empty and an empty app reviews nothing.
      #
      # Which backend depends on the mode. per-convex-pr uses --preview-create,
      # which deletes and recreates the deployment on every push, so the data can
      # never be a stale mix of two schemas and the seed runs again each time.
      # shared-branch-backend uses --preview-name, because a second CI system
      # (a Vercel web preview) is deploying to the same backend for the same PR:
      # two systems racing to delete each other's deployment mid-review is worse
      # than carrying data across pushes. That race is also why it retries.
      - name: Create Convex preview deployment
        id: convex-preview
        if: steps.scope.outputs.publish == 'true' && steps.backend.outputs.own == 'true' && env.CONVEX_PREVIEW_DEPLOY_KEY != ''
        env:
          CONVEX_DEPLOY_KEY: ${{ env.CONVEX_PREVIEW_DEPLOY_KEY }}
          MODE: ${{ inputs.convex-preview-mode }}
          SEED_FUNCTION: ${{ inputs.convex-seed-function }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Convex names a CI preview deployment after the git branch verbatim,
          # slashes included, so this is passed unsanitised: a sanitised name
          # would silently mint a second backend for any agent/... branch and the
          # web preview would still be on the first. It is passed explicitly
          # because a pull_request checkout is a detached HEAD, where Convex's
          # own branch detection would resolve the useless name "HEAD".
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "shared-branch-backend" ]; then
            deploy_args=(--preview-name "$PREVIEW_BRANCH")
            attempts=3
          else
            deploy_args=(--preview-create "pr-${PR_NUMBER}")
            attempts=1
          fi

          # Convex generates the deployment's hostname, so the only way to learn
          # it is --cmd, which runs a command with the URL in the variable named
          # by --cmd-url-env-var-name. Here that command just writes the URL down
          # for the steps below instead of doing the build itself.
          deployed=false
          for attempt in $(seq 1 "$attempts"); do
            if $PM_EXEC convex deploy \
              "${deploy_args[@]}" \
              --preview-run "$SEED_FUNCTION" \
              --cmd-url-env-var-name CONVEX_PREVIEW_URL \
              --cmd 'printenv CONVEX_PREVIEW_URL > "$RUNNER_TEMP/convex-preview-url"'; then
              deployed=true
              break
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::convex deploy attempt $attempt failed (likely a concurrent push from another CI system deploying to the same backend); retrying in 30s"
              sleep 30
            fi
          done

          if [ "$deployed" != "true" ]; then
            echo "convex deploy failed after ${attempts} attempt(s)"
            exit 1
          fi

          url="$(cat "$RUNNER_TEMP/convex-preview-url")"
          if [ -z "$url" ]; then
            echo "convex deploy did not report a preview deployment URL"
            exit 1
          fi

          # Both halves of one backend: queries and mutations over .convex.cloud,
          # HTTP actions over the .convex.site twin. An app that derives the twin
          # itself usually prefers an explicit value when one exists — writing it
          # here means nothing else can supply a twin that points at a different
          # deployment.
          {
            echo "EXPO_PUBLIC_CONVEX_URL=$url"
            echo "EXPO_PUBLIC_CONVEX_SITE_URL=${url%.convex.cloud}.convex.site"
          } >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # This workflow has to survive the PR that introduces it, and any repo
      # clone that never adds the key. Falling back to the old behaviour is
      # right; doing it silently is not, because the preview would look like it
      # was testing the branch's backend when it was not.
      - name: Warn that Convex previews are unconfigured
        if: steps.scope.outputs.publish == 'true' && steps.backend.outputs.own == 'true' && env.CONVEX_PREVIEW_DEPLOY_KEY == ''
        run: |
          echo "::warning::This PR needs a Convex preview backend, but the CONVEX_PREVIEW_DEPLOY_KEY secret is not set, so the preview runs against the shared dev deployment and will not include this branch's backend changes. Add a Convex Preview deploy key (Convex dashboard -> project Settings -> Deploy keys -> Generate a Preview deploy key) as a repository secret named CONVEX_PREVIEW_DEPLOY_KEY."

      # Skipped entirely in `auto` mode, where a skipped step's outputs read as
      # empty and the publish steps below fall back to --auto unchanged.
      #
      # Both values are built here from the event payload read as environment
      # variables rather than interpolated straight into the command below: a PR
      # title is attacker-controlled text on a fork PR, and `${{ }}` pastes it
      # into the argument string verbatim. Quotes and backslashes come out, so
      # what reaches `command:` can only end the argument it belongs to.
      - name: Resolve the EAS update branch
        id: update-branch
        if: steps.scope.outputs.publish == 'true' && inputs.eas-update-branch != 'auto'
        env:
          NAMING: ${{ inputs.eas-update-branch }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$NAMING" != "pr-branch" ]; then
            echo "eas-update-branch must be auto or pr-branch, got: '$NAMING'" >&2
            exit 1
          fi

          # A quote or a backslash would let either value close the argument it
          # sits in; a newline would let a title forge a second step output. The
          # backslash goes through a variable because `${v//\\/}` does not
          # actually match one.
          backslash='\'
          strip() {
            local s="${1//\"/}"
            s="${s//"$backslash"/}"
            s="${s//$'\n'/ }"
            printf '%s' "${s//$'\r'/ }"
          }

          # Slashes out: an EAS update branch is a flat name, so agent/issue-1-x
          # becomes agent-issue-1-x, near enough to the Convex deployment's name
          # to read as the same handle in both dashboards.
          name="$(strip "${PREVIEW_BRANCH//\//-}")"
          message="PR #${PR_NUMBER}: $(strip "${PR_TITLE:0:120}")"

          printf 'flags=--branch "%s" --message "%s"\n' "$name" "$message" >> "$GITHUB_OUTPUT"

      # The convex-preview path publishes WITHOUT --environment, and that is the
      # whole trick. eas update merges the EAS-hosted environment's variables
      # over the process environment (eas-cli spreads them last, so the server
      # value wins), which would quietly put the shared dev URL back into a
      # bundle we just pointed at a per-PR backend. Omitting the flag makes
      # eas update use the process environment alone. Either naming supplies the
      # branch and message the CLI would otherwise prompt for: --auto, or the
      # --branch/--message pair the step above resolves.
      #
      # The cost: this bundle gets only the EXPO_PUBLIC_* values set on the job
      # above, so the EAS environment's extras are missing — a portal base URL
      # most of all, which degrades Share to a plain share with no link. That is
      # the honest outcome anyway: a portal is one fixed origin wired to the
      # shared dev backend, and it could never read this PR's data.
      - name: Create PR preview against the Convex preview deployment
        if: steps.scope.outputs.publish == 'true' && steps.convex-preview.outputs.url != ''
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update ${{ steps.update-branch.outputs.flags || '--auto' }} --platform ${{ inputs.eas-platform }} --non-interactive

      - name: Create PR preview
        if: steps.scope.outputs.publish == 'true' && steps.convex-preview.outputs.url == ''
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update ${{ steps.update-branch.outputs.flags || '--auto' }} --platform ${{ inputs.eas-platform }} --environment ${{ inputs.eas-environment }} --non-interactive
