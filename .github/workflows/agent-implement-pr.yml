name: Agent Implement (PR)

# Reusable. The caller keeps the `pull_request_target: [labeled]` trigger:
# pull_request_target runs in the base repo context, so labeled events still
# fire when the generated merge commit is unavailable. The first step below
# refuses anything except same-repo agent branches before checkout or secret
# use — that guard is why this workflow may read secrets at all. Do not relax it.

on:
  workflow_call:
    inputs:
      package-manager:
        description: "npm, pnpm, or yarn. Decides the install and exec commands."
        type: string
        default: npm
      sandcastle-path:
        description: "Repo-relative directory holding the agent scripts (implement-pr/, ...)."
        type: string
        default: .sandcastle
      node-version:
        description: "Node version the agent scripts run on."
        type: string
        default: "22"
      base-branch:
        description: "Branch the trusted scripts are read from and the PR diffs against."
        type: string
        default: main
      git-user-name:
        description: "Commit author name for agent commits."
        type: string
        default: "claude-code[bot]"
      git-user-email:
        description: >-
          Commit author email for agent commits. Vercel matches preview builds on
          the author's email, so this should be an address on the repo owner's
          GitHub account for agent branches to get web previews.
        type: string
        required: true

jobs:
  implement-pr:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ inputs.base-branch }}
      PM_INSTALL: ${{ inputs.package-manager == 'pnpm' && 'pnpm install' || inputs.package-manager == 'yarn' && 'yarn install' || 'npm install' }}
      PM_EXEC: ${{ inputs.package-manager == 'pnpm' && 'pnpm exec' || inputs.package-manager == 'yarn' && 'yarn' || 'npx' }}

    steps:
      - name: Refuse untrusted PR branch
        id: trust
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "reason=PR head repo $HEAD_REPO is not $GH_REPO." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$BRANCH" in
            agent/*)
              echo "trusted=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "reason=PR branch $BRANCH does not start with agent/." >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Comment on refused PR
        if: steps.trust.outputs.trusted != 'true'
        env:
          REASON: ${{ steps.trust.outputs.reason }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement\`: $REASON Automated implementation only runs on same-repo \`agent/*\` branches created by the agent implement workflow."

      - name: Pre-flight - refuse if PR is closed or merged
        if: steps.trust.outputs.trusted == 'true'
        id: state
        run: |
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement\`: PR is not open."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight - refuse if there is nothing to act on
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true'
        id: inputs
        run: |
          set -euo pipefail
          top_level=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | length')
          review_summaries=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" --jq '[.[] | select(.body != null and .body != "")] | length')
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          unresolved=$(gh api graphql \
            -F owner="$owner" -F repo="$repo" -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          total=$((top_level + review_summaries + unresolved))
          if [ "$total" -eq 0 ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement\`: no unresolved review threads, review summaries, or top-level PR comments to act on."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition labels - remove trigger and blocked, add in-progress
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout trusted workflow scripts
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          path: .agent-workflow
          sparse-checkout: |
            ${{ inputs.sandcastle-path }}/implement-pr
            ${{ inputs.sandcastle-path }}/review/parse-diff-lines.ts
            ${{ inputs.sandcastle-path }}/retry-feedback.ts
            ${{ inputs.sandcastle-path }}/run-with-extraction.ts
            ${{ inputs.sandcastle-path }}/run-with-retry.ts

      - name: Hide trusted workflow checkout from PR diffs
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: echo ".agent-workflow/" >> .git/info/exclude

      - name: Ensure the base branch is available for diffing
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: |
          git fetch origin "$BASE_BRANCH:$BASE_BRANCH" || git fetch origin "$BASE_BRANCH"
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"

      - name: Setup Node.js
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: $PM_INSTALL

      - name: Install Claude Code
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        env:
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Run implement-pr.ts
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        id: implement
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: $PM_EXEC tsx .agent-workflow/${{ inputs.sandcastle-path }}/implement-pr/implement-pr.ts

      - name: Push branch (abort cleanly if non-fast-forward)
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        id: push
        run: |
          has_commits=$(cat "${RUNNER_TEMP}/has_commits.txt")
          if [ "$has_commits" != "true" ]; then
            echo "No commits this run - skipping push."
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post thread replies
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId - skipping" >&2
              continue
            fi
            gh api \
              --method POST \
              "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" \
              -f body="$body"
          done

      - name: Post new inline comments
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        env:
          INLINE: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          commit_id=$(jq -r '.commit_id' "$INLINE")
          count=$(jq '.comments | length' "$INLINE")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".comments[$i].path" "$INLINE")
            line=$(jq -r ".comments[$i].line" "$INLINE")
            side=$(jq -r ".comments[$i].side" "$INLINE")
            body=$(jq -r ".comments[$i].body" "$INLINE")
            gh api \
              --method POST \
              "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f body="$body" \
              -f commit_id="$commit_id" \
              -f path="$path" \
              -F line="$line" \
              -f side="$side"
          done

      - name: Post top-level PR comments
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && success()
        env:
          TOP: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$TOP")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$TOP")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Mark blocked on failure
        if: steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written - check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          \`agent:implement\` run on this PR failed.

          **Reason:** $reason

          **Workflow run:** $RUN_URL

          Re-add \`agent:implement\` to retry.
          EOF
          )"

      - name: Always remove in-progress label
        if: always() && steps.trust.outputs.trusted == 'true' && steps.state.outputs.proceed == 'true' && steps.inputs.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
